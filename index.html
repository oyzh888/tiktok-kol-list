// Sort state
let sortKey = 'score';
let sortDir = -1;
let filtered = [...RAW];

function fmt(n) {
  if (n == null || n === 0) return '<span class="empty">—</span>';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toString();
}

function scoreClass(s) {
  if (s >= 90) return 'score-90';
  if (s >= 80) return 'score-80';
  if (s >= 70) return 'score-70';
  if (s >= 60) return 'score-60';
  if (s >= 50) return 'score-50';
  if (s >= 30) return 'score-30';
  return 'score-0';
}

function renderStats() {
  const total = RAW.length;
  const withEmail = RAW.filter(r => r.email).length;
  const topTier = RAW.filter(r => r.score >= 70).length;
  const totalFollowers = RAW.reduce((a,b) => a + (b.followers||0), 0);
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">Total Creators</div></div>
    <div class="stat-card"><div class="num">${topTier}</div><div class="lbl">Score 70+</div></div>
    <div class="stat-card"><div class="num">${withEmail}</div><div class="lbl">Has Email</div></div>
    <div class="stat-card"><div class="num">${fmt(totalFollowers)}</div><div class="lbl">Total Followers</div></div>
  `;
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const noRes = document.getElementById('noResults');
  document.getElementById('countBadge').textContent = `${filtered.length} creators`;

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  tbody.innerHTML = filtered.map(r => {
    const emailCell = r.email
      ? `<a class="email-link" href="mailto:${r.email}">${r.email}</a>`
      : `<span class="no-email">—</span>`;
    const titlesCell = r.titles && r.titles.length
      ? r.titles.map(t => `<span class="title-tag" title="${t}">${t}</span>`).join('')
      : `<span class="empty">—</span>`;
    const lastPost = (r.last_post_days != null && r.last_post_days > 0)
      ? `<span style="color:#ffd666">${r.last_post_days}d ago</span>`
      : (r.last_post_days === 0 ? '<span style="color:#ff7875">inactive?</span>' : '<span class="empty">—</span>');

    return `
      <tr>
        <td class="handle"><a href="${r.url}" target="_blank" rel="noopener">${r.handle}</a></td>
        <td class="name-cell">
          <div class="name-main">${r.name}</div>
          <div class="name-bio" title="${r.bio||''}">${r.bio||''}</div>
        </td>
        <td class="num-cell followers">${fmt(r.followers)}</td>
        <td class="num-cell avg-views">${fmt(r.avg_views)}</td>
        <td class="num-cell">${lastPost}</td>
        <td>${emailCell}</td>
        <td class="titles-cell">${titlesCell}</td>
        <td class="num-cell"><span class="score-badge ${scoreClass(r.score)}">${r.score || '—'}</span></td>
      </tr>`;
  }).join('');
}

function applyFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const minScore = parseInt(document.getElementById('minScore').value) || 0;
  const emailF = document.getElementById('emailFilter').value;

  filtered = RAW.filter(r => {
    if (q) {
      const haystack = `${r.handle} ${r.name} ${r.bio||''} ${r.email||''}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    if (r.score < minScore) return false;
    if (emailF === 'yes' && !r.email) return false;
    if (emailF === 'no' && r.email) return false;
    return true;
  });

  sortData();
  renderTable();
}

function sortBy(key) {
  if (sortKey === key) { sortDir *= -1; }
  else { sortKey = key; sortDir = -1; }
  // update header classes
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
  const headers = ['handle','name','followers','avg_views','last_post_days',null,null,'score_total'];
  const keys = ['handle','name','followers','avg_views','last_post_days',null,null,'score'];
  const idx = keys.indexOf(key);
  if (idx >= 0) document.querySelectorAll('thead th')[idx].classList.add('sorted');
  sortData();
  renderTable();
}

function sortData() {
  filtered.sort((a, b) => {
    let va = a[sortKey] ?? -1;
    let vb = b[sortKey] ?? -1;
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return sortDir;
    if (va > vb) return -sortDir;
    return 0;
  });
}

// Init
sortData();
renderStats();
renderTable();
